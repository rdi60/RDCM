{% extends "base.html" %}
{% block title %}Edit topic · DataVault{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit “{{ topic.name }}”</h1></div>
<form method="post" class="panel form-panel">
  {% csrf_token %}
  <label>Name</label>
  {{ form.name }}
  <label>Description</label>
  {{ form.description }}
  <div class="form-row">
    <div><label>Colour</label>{{ form.color }}</div>
    <div><label>Order</label>{{ form.order }}</div>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{% url 'library:topic_list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
