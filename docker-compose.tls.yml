# HTTPS overlay — use together with docker-compose.yml once you have a
# domain pointed at this VPS. See README's "Adding HTTPS" section for the
# full sequence (get the first certificate, then bring this up).
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# This only adds to/overrides the base file; it isn't standalone.

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  # Renews the certificate in the background every 12h (certbot no-ops
  # unless a cert is actually due). Does NOT fetch the first certificate —
  # that's the one-time standalone command in the README, run before this
  # overlay is brought up at all.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"

volumes:
  letsencrypt:
  certbot-webroot:
