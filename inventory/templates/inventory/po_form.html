{% extends "base.html" %}
{% block title %}New purchase order · {{ clinic_name }}{% endblock %}
{% block content %}
<h1>New purchase order</h1>
<form method="post" class="stacked-form" style="max-width:480px">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<div class="field-error">{{ field.errors|striptags }}</div>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Create draft</button>
</form>
{% endblock %}
