{% extends "base.html" %}
{% block title %}Sign in · {{ clinic_name }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1 style="font-size:1.2rem;margin-top:0">{{ clinic_name }}</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p style="color:var(--bad)">Incorrect username or password.</p>
    {% endif %}
    <div class="field">
      <label for="id_username">Username</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%">Sign in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
